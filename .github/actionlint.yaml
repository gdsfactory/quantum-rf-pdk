paths:
  # actionlint v1.7.12 predates step-level parallelism (parallel, background
  # steps and wait, shipped 2026-06-25), so it rejects the new step keys. Scoped
  # to the workflows that use them so the rest keep full syntax checking.
  # Drop this once rhysd/actionlint#693 ships.
  .github/workflows/test.yml:
    ignore:
      - 'unknown permission scope "code-quality"'
      - 'unexpected key "background" for step'
      - 'unexpected key "parallel" for step'
      - 'step must run script with "run" section or run action with "uses" section'
  .github/workflows/pages.yml:
    ignore:
      - 'unexpected key "background" for step'
      - 'step must run script with "run" section or run action with "uses" section'
