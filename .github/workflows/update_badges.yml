name: Update Badges
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:
  group: update-badges
  cancel-in-progress: true
permissions: {}
jobs:
  badges:
    # A called workflow cannot be granted more than the caller allows, and the
    # call is rejected at startup rather than downgraded.
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/update_badges.yml@main # zizmor: ignore[unpinned-uses]
    secrets: inherit # zizmor: ignore[secrets-inherit]
