name: Update Zenodo metadata
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      ZENODO_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to update
        required: true
        type: string
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Update Zenodo metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: uv run --script .github/zenodo/update_metadata.py "$RELEASE_TAG"
