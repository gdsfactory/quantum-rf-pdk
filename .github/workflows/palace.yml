name: Palace pipeline smoke test
on:
  pull_request:
    paths:
      - ".github/palace_smoke.py"
      - ".github/workflows/palace.yml"
      - "qpdk/cells/**"
      - "qpdk/models/**"
      - "qpdk/simulation/**"
      - "qpdk/tech.py"
      - "qpdk/utils.py"
      - "notebooks/src/palace_eigenmode_qubit_resonator.py"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  palace-eigenmode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install system libraries for Gmsh
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1
      - name: Install qpdk
        run: uv sync --locked --python 3.12 --extra models --group palace
      - name: Generate the small eigenmode simulation
        run: >
          uv run --no-sync python .github/palace_smoke.py generate --out build/palace_ci_sim

      - name: Install the Palace CPU runtime
        run: |
          wheel=palacetoolkit_palace_cpu-0.18.0-py3-none-linux_x86_64.whl
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$wheel" \
            "https://github.com/EpsilonForge/PalaceToolkit/releases/download/palace-cpu-v0.18.0/palacetoolkit_palace_cpu-0.18.0-py3-none-linux_x86_64.whl"
          echo "b8b0f29a3c933f4066325410710d1960edd01ccb7bb217042186a6432d8d57be  $RUNNER_TEMP/$wheel" | sha256sum --check
          uv pip install --no-deps "$RUNNER_TEMP/$wheel"
      - name: Run Palace
        env:
          OMP_NUM_THREADS: "2"
        run: |
          set -o pipefail
          palace="$(uv run --no-sync python -c 'from palacetoolkit_palace_cpu import palace_binary_path; print(palace_binary_path())')"
          libraries="$(uv run --no-sync python -c 'from palacetoolkit_palace_cpu import palace_library_path; print(palace_library_path())')"
          export LD_LIBRARY_PATH="$libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd build/palace_ci_sim
          "$palace" -np 1 config.json 2>&1 | tee run.log
      - name: Check eigenmode results
        run: uv run --no-sync python .github/palace_smoke.py check --sim build/palace_ci_sim
      - name: Upload simulation outputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palace-smoke-failure
          path: |
            build/palace_ci_sim/run.log
            build/palace_ci_sim/output
          if-no-files-found: ignore
          retention-days: 7
