name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.action }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/claude-pr-review.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
