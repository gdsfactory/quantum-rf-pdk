name: Claude PR Review
on:
  # This runs in the trusted base-repository context, so fork PRs can use the
  # repository's OIDC identity and API key. Do not check out or execute PR code
  # in this workflow.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-claude-pr-review
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # --comment makes the review post to the PR. The inline comment tool
          # is granted below because claude-code-action only adds that MCP
          # server when claude_args requests the tool.
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
          claude_args: |
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # Not setting allowed_non_write_users: it enables the action's
          # subprocess env scrub, which strips the GitHub token from Claude's
          # shell. Trade-off: forks and Dependabot are not reviewed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
