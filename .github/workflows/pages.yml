name: Docs
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:
jobs:
  build-docs-pdf:
    runs-on: ubuntu-latest
    name: Build PDF docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install Python dependencies
        run: just install
      # typsphinx compiles the PDF with the Typst compiler bundled in typst-py,
      # so there is nothing to install for it -- but the Typst packages the
      # template imports (codly, mitex, gentle-clues) are downloaded on first
      # use and cached here.
      - name: Cache Typst packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/typst
            build/docs-fonts
          key: ${{ runner.os }}-typst-${{ hashFiles('docs/docs.just', 'docs/typst/**/*.typ') }}
          restore-keys: |
            ${{ runner.os }}-typst-
      - name: Build PDF documentation
        run: just docs-pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-docs
          path: "./docs/_build/typstpdf/qpdk.pdf"
          if-no-files-found: error
      - name: Upload generated Typst sources on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typst-sources
          path: |
            docs/_build/typstpdf/**/*.typ
          if-no-files-found: ignore
  pages:
    permissions:
      actions: read
      pages: write
      id-token: write
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/pages.yml@main # zizmor: ignore[unpinned-uses, secrets-inherit]
    secrets:
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
      SIMCLOUD_APIKEY: ${{ secrets.SIMCLOUD_APIKEY }}
  deploy-docs:
    needs: [build-docs-pdf, pages]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: combined_tmp
      - name: Extract and combine
        run: |
          mkdir -p combined
          tar -xf combined_tmp/artifact.tar -C combined
      - name: Download PDF docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdf-docs
          path: combined
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-with-pdf
          path: combined
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-with-pdf
