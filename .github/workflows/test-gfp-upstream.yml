name: Test GDSFactory+ upstream

permissions:
  contents: read
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
concurrency:
  group: test-gfp-upstream
  cancel-in-progress: true

jobs:
  # Run the gfp suite against the latest gdsfactoryplus release on PyPI and
  # the latest VS Code extension (for the `gfp` binary), ahead of the lockfile.
  test-gfp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The gdsfactoryplus wheels are cp312-only.
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Upgrade gdsfactoryplus to the latest release
        run: uv lock --upgrade-package gdsfactoryplus
      - name: Test GDSFactory+
        run: just test-gfp
