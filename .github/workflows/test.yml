name: Test
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      PREK_SKIP: matlab-diagnostics,matlab-format,matlab-quickfix  # No license
      # See test-julia.
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - parallel:
          - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
          - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - parallel:
          - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
            with:
              version: "min"
              project: .github/julia
          # Pyrefly needs the project extras, including the Python 3.12 SDK wheels.
          - run: uv sync --all-extras --group palace --no-install-project --python 3.12
      # Caches the JuliaFormatter and JuliaWorkspaces depot for the Julia hooks.
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      # The check-schematic-sources hook needs the `gfp` binary, which ships
      # only in the VS Code extension.
      - name: Fetch gfp binary
        run: just fetch-gfp
      # lychee's pre-commit hook installs its own binary via cargo-binstall,
      # which needs the token to avoid 403 rate limiting from api.github.com.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test-julia:
    runs-on: ubuntu-latest
    # A cold cache precompiles for every target in JULIA_CPU_TARGET, which takes
    # over 30 minutes; warm runs take a few.
    timeout-minutes: 60
    env:
      # PythonCall uses the uv environment, which has QPDK, instead of CondaPkg.
      JULIA_CONDAPKG_BACKEND: "Null"
      # Hosted runners mix CPUs (Sapphire Rapids, EPYC 7763, EPYC 9V74). The
      # default `native` target ties pkgimages to the CPU that built them, so a
      # cache saved on one model is rejected on another and every package
      # recompiles. This is the target list of the official x86_64 binaries.
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - parallel:
          # The notebook Manifest is resolved with the latest 1.12 release.
          - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
            with:
              version: "1.12"
          - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - parallel:
          - run: uv sync --extra models
          - name: Install the notebook environment and kernel
            run: julia --startup-file=no --project=notebooks/data/josephsoncircuits_twpa/julia -e 'using Pkg; Pkg.instantiate(); using IJulia; installkernel("Julia", "--project=$(dirname(Base.active_project()))"; specname="julia-1.12")'
      - name: Check Julia simulation helpers
        run: julia --startup-file=no --project=notebooks/data/josephsoncircuits_twpa/julia/checks notebooks/data/josephsoncircuits_twpa/julia/checks/checks.jl
      - name: Execute the JosephsonCircuits notebook
        run: uvx --with nbconvert==7.17.2 --with ipykernel==7.4.0 jupytext@1.19.6 --to ipynb --execute --run-path notebooks -o "$RUNNER_TEMP/josephsoncircuits_twpa.ipynb" notebooks/src/josephsoncircuits_twpa.jl
  get-python-versions:
    uses: ./.github/workflows/get-python-versions.yml
  test-code:
    needs: get-python-versions
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install gmsh's native libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes libglu1-mesa
      - name: Test with pytest
        run: just test ${{ matrix.os == 'ubuntu-latest' && '--cov=qpdk --cov-report=html --cov-report=xml' || '' }} --junitxml=junit.xml -o junit_family=legacy
      # `!cancelled()` so test results still upload when pytest fails, which
      # is exactly when the failed-test report is useful.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false
      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: uv run --group dev --group github genbadge coverage -i coverage.xml -o htmlcov/coverage.svg
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov
  upload-coverage:
    needs: test-code
    if: ${{ !cancelled() && needs.test-code.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-xml-*
          merge-multiple: true
      - parallel:
          - name: Upload code coverage to GitHub
            uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
            with:
              file: coverage.xml
              language: Python
              label: code-coverage/pytest
              fail-on-error: false
          - name: Upload coverage to Codecov
            uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
            with:
              token: ${{ secrets.CODECOV_TOKEN }}
              fail_ci_if_error: false
  test-code-result:
    runs-on: ubuntu-latest
    name: Test result
    needs: test-code
    if: always()
    steps:
      - name: Check test matrix results
        run: |
          if [[ "${{ needs.test-code.result }}" == "success" ]]; then
            echo "All test jobs succeeded"
            exit 0
          else
            echo "One or more test jobs failed"
            exit 1
          fi
  test-gdsfactoryplus:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The gdsfactoryplus wheels are cp312-only.
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Test GDSFactory+
        run: just test-gfp
  test-gdsfactoryplus-result:
    runs-on: ubuntu-latest
    name: GDSFactory+ test result
    needs: [test-gdsfactoryplus]
    # always() suppresses the implicit success(), so the fork gate alone decides:
    # on fork PRs this job is skipped, which makes the required check neutral
    # ("skipped") for branch protection; on the main repo it must run, and the
    # check below then fails on any failed, cancelled or skipped test job.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check GDSFactory+ test result
        run: |
          RESULT="${{ needs.test-gdsfactoryplus.result }}"
          if [[ "$RESULT" == "success" ]]; then
            echo "GDSFactory+ tests succeeded"
          else
            echo "GDSFactory+ tests did not succeed (result: $RESULT)"
            exit 1
          fi
  code-coverage:
    permissions:
      contents: write
      pull-requests: write
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/test_coverage.yml@main # zizmor: ignore[unpinned-uses]
    secrets: inherit # zizmor: ignore[secrets-inherit]
  model-coverage:
    permissions:
      contents: write
      pull-requests: write
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/model_coverage.yml@main # zizmor: ignore[unpinned-uses]
    secrets: inherit # zizmor: ignore[secrets-inherit]
  model-regression:
    permissions:
      contents: write
      pull-requests: write
    uses: doplaydo/pdk-ci-workflow-public/.github/workflows/model_regression.yml@main # zizmor: ignore[unpinned-uses]
    secrets: inherit # zizmor: ignore[secrets-inherit]
  test-matlab:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      # The MATLAB licence granted to open-source GitHub projects does not include the RF
      # Toolbox, so the notebook's S-parameter sections are skipped here. They still detect
      # the toolbox at run time; this variable just makes the skip explicit and deterministic.
      # Remove it to exercise those sections on a runner whose licence does cover RF Toolbox.
      QPDK_SKIP_RF_TOOLBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up MATLAB
        id: matlab-setup
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          cache: true
          products: >-
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Global_Optimization_Toolbox
            Parallel_Computing_Toolbox
        background: true # runs alongside the Python setup below, MATLAB install is the slower branch
      - name: Install qpdk with models extra
        run: uv sync --extra models
      - name: Export QPDK_PYTHON and Python library paths
        run: |
          QPDK_PY="$(uv run python -c 'import sys; print(sys.executable)')"
          PY_LIBDIR="$(${QPDK_PY} -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          {
            echo "QPDK_PYTHON=${QPDK_PY}"
            echo "LD_LIBRARY_PATH=${PY_LIBDIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "$GITHUB_ENV"
          echo "Python: ${QPDK_PY}"
          echo "LIBDIR: ${PY_LIBDIR}"
      - name: Sanity-check qpdk import (Python side)
        run: uv run python -c "import qpdk; qpdk.PDK.activate(); print('qpdk activated:', qpdk.PDK.name)"
      - name: Check the saved MATLAB notebook
        shell: uv run --no-sync python {0}
        run: |
          import hashlib
          import json
          from pathlib import Path

          notebook = json.loads(Path("notebooks/matlab_integration.ipynb").read_text())
          code_cells = [cell for cell in notebook["cells"] if cell["cell_type"] == "code"]
          if not code_cells or any(
              cell.get("execution_count") is None
              or any(output.get("output_type") == "error" for output in cell.get("outputs", []))
              for cell in code_cells
          ):
              raise SystemExit("Saved MATLAB notebook has incomplete or failed cells")

          def stream_text(cell):
              return "\n".join(
                  "".join(output["text"]) if isinstance(output.get("text"), list) else output.get("text", "")
                  for output in cell.get("outputs", [])
                  if output.get("output_type") == "stream"
              )

          output = "\n".join(stream_text(cell) for cell in code_cells)
          # The saved run also covers RF Toolbox, which the CI licence excludes.
          required = (
              "RF Toolbox available",
              "Max |S13| =",
              "Notch:",
              "1 mm + 1 mm vs. 2 mm:",
              "Rational fit:",
              "Read back into SAX:",
              "Residual norm",
              "Linear fit R^2:",
              "Pareto front:",
              "Built 16 chips on",
          )
          if any(string not in output for string in required):
              raise SystemExit("Saved MATLAB notebook is missing toolbox results")
          if not any(
              "image/png" in cell_output.get("data", {})
              for cell in code_cells
              for cell_output in cell.get("outputs", [])
          ):
              raise SystemExit("Saved MATLAB notebook has no inline figures")
          # MATLAB prints console warnings wrapped in backspace characters, which the
          # PDF/A fonts cannot display, so control characters fail the build here.
          if any(
              ord(character) < 32 and character not in "\n"
              for cell in code_cells
              for cell_output in cell.get("outputs", [])
              for character in stream_text(cell)
          ):
              raise SystemExit("Saved MATLAB notebook contains console control characters")

          # The fingerprint cell printed during the saved run binds those outputs to the
          # committed source; recompute it to catch the two drifting apart.
          expected = hashlib.sha256(Path("notebooks/src/matlab_integration.m").read_bytes()).hexdigest()
          fingerprint = stream_text(code_cells[-1])
          if fingerprint.strip() != f"Executed source SHA256: {expected}":
              raise SystemExit("Saved MATLAB notebook does not match its source")
          print("Saved MATLAB notebook verified: outputs match the committed source")
      - name: Wait for MATLAB setup
        wait: matlab-setup
      - uses: nikosavola/MATLAB-language-server-pre-commit@5966190480d0a77bf731bac19df84417aabc63b2 # v0.1.1
      - name: Sanity-check MATLAB ↔ Python bridge
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: |
            diary('/tmp/matlab_bridge.log'); diary on;
            disp(getenv('QPDK_PYTHON'));
            pe = pyenv('Version', getenv('QPDK_PYTHON'), 'ExecutionMode', 'OutOfProcess');
            disp(pe);
            py.print('python is reachable from MATLAB');
            qpdk_mod = py.importlib.import_module('qpdk');
            PDK = py.getattr(qpdk_mod, 'PDK');
            PDK.activate();
            disp(string(py.getattr(PDK, 'name')));
            diary off;
      - name: Run MATLAB notebook source script
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: |
            diary('/tmp/matlab_script.log'); diary on;
            addpath('notebooks/src');
            matlab_integration;
            assert(all(structfun(@(available) available, has_toolbox)), ...
              'The four optional toolbox sections must execute in CI.');
            diary off;
      - name: Print MATLAB diary on failure
        if: failure()
        run: |
          echo "=== /tmp/matlab_bridge.log ==="
          cat /tmp/matlab_bridge.log 2>/dev/null || echo "(missing)"
          echo "=== /tmp/matlab_script.log ==="
          cat /tmp/matlab_script.log 2>/dev/null || echo "(missing)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: matlab-notebook-artifacts
          path: |
            /tmp/qpdk_matlab_demo/**
            /tmp/matlab_bridge.log
            /tmp/matlab_script.log
          if-no-files-found: warn
  # Docs skip solver notebooks, so exercise this one in its own job.
  test-elmer-notebook:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Elmer FEM
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install --yes elmerfem-csc libglu1-mesa
          command -v ElmerGrid
          command -v ElmerSolver
          dpkg-query -W --showformat='${Package} ${Version}\n' elmerfem-csc
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install QPDK with the models extra and the Elmer driver
        run: |
          uv add --no-sync "gplugins[elmer] @ git+https://github.com/gdsfactory/gplugins.git@c3372b97a50cda44043603f80c955edcf028a7fb"
          uv sync --locked --python 3.12 --no-dev --extra models
          uv pip install jupytext nbconvert ipykernel
      - name: Check the saved Elmer result
        shell: uv run --no-sync python {0}
        run: |
          import re

          import nbformat

          notebook = nbformat.read("notebooks/elmer_capacitance_interdigital.ipynb", as_version=4)
          code_cells = [cell for cell in notebook.cells if cell.cell_type == "code"]
          if not code_cells or any(
              cell.execution_count is None
              or any(output.output_type == "error" for output in cell.outputs)
              for cell in code_cells
          ):
              raise SystemExit("Saved Elmer notebook has incomplete or failed cells")
          output = "\n".join(
              str(item.text)
              for cell in code_cells
              for item in cell.outputs
              if item.output_type == "stream"
          )
          required = (
              "Elmer notebook run mode: high accuracy (element_order=3",
              "Final reported mutual capacitance:",
              "Final terminal o1 to ground:",
              "Final terminal o2 to ground:",
              "(element_order=3, mesh factor 0.25)",
              "Lateral-domain sensitivity check passed: change <= 1 %",
              "All checks passed.",
          )
          if any(marker not in output for marker in required):
              raise SystemExit("Saved Elmer notebook is missing the high accuracy result")
          if output.count("MAIN: *** Elmer Solver: ALL DONE ***") != 6:
              raise SystemExit("Saved Elmer notebook is missing a completed solve")
          match = re.search(
              r"Mesh convergence check passed: final changes ([\d.]+) % and "
              r"([\d.]+) % <= tolerance 0\.5 %",
              output,
          )
          if match is None or any(float(value) > 0.5 for value in match.groups()):
              raise SystemExit("Saved Elmer notebook does not meet 0.5 % convergence")
          plots = sum(
              "image/png" in item.get("data", {})
              for cell in code_cells
              for item in cell.outputs
          )
          if plots < 2:
              raise SystemExit("Saved Elmer notebook is missing a plot")
      - name: Execute the Elmer notebook
        run: uv run --no-sync jupytext --execute --to ipynb --set-kernel python3 --output /tmp/qpdk-elmer-ci.ipynb notebooks/elmer_capacitance_interdigital.ipynb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: elmer-notebook-logs
          path: |
            /tmp/qpdk_elmer_interdigital_capacitor_*/*.log
            /tmp/qpdk_elmer_interdigital_capacitor_*/*.sif
          if-no-files-found: warn

  test-palace:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install mesh libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
      - name: Install Palace experiment dependencies
        run: uv sync --locked --python 3.12 --no-dev --extra models --group palace --group test
      - name: Run real Palace tests
        run: |
          mkdir -p build
          uv run --no-sync pytest -m palace tests/models --basetemp=build/palace-tests --durations=0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: palace-test-logs
          path: |
            build/palace-tests/**/solver.log
            build/palace-tests/**/inputs.json
            build/palace-tests/**/config.json
          if-no-files-found: warn

  test-vacask:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
      VACASK_VERSION: 0.3.4
      VACASK_SHA256: 780949fc75181d5839cc8c8091e05c2ca2e70a73c9f920e88553228061c44027
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Install VACASK
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils libklu2 libopenblas0
          archive="vacask_${VACASK_VERSION}_linux-x86_64"
          curl --fail --silent --show-error --location --output /tmp/vacask.tar.gz \
            "https://codeberg.org/arpadbuermen/VACASK/releases/download/_${VACASK_VERSION}/${archive}.tar.gz"
          echo "${VACASK_SHA256}  /tmp/vacask.tar.gz" | sha256sum --check
          tar -xzf /tmp/vacask.tar.gz -C /opt
          prefix="/opt/${archive}"
          {
            echo "SIM_MODULE_PATH=${prefix}/lib/vacask/mod"
            echo "SIM_INCLUDE_PATH=${prefix}/lib/vacask/inc"
            echo "SIM_OPENVAF=${prefix}/bin/openvaf-r"
          } >> "$GITHUB_ENV"
          echo "${prefix}/bin" >> "$GITHUB_PATH"
      - name: Check VACASK
        run: vacask -h
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install QPDK with the models extra
        run: |
          uv sync --locked --python 3.12 --no-dev --group test --extra models
          uv pip install jupytext nbconvert ipykernel
      - name: Run the VACASK tests
        run: uv run --no-sync pytest tests/test_vacask.py -m vacask
      - name: Execute the VACASK notebooks
        run: |
          for example in lumped cpw; do
            uv run --no-sync jupytext --execute --to ipynb --set-kernel python3 \
              --output "/tmp/qpdk-vacask-${example}.ipynb" \
              "notebooks/vacask_${example}_parametric_amplifier.ipynb"
          done
      - name: Check scientific results are embedded
        shell: uv run --no-sync python {0}
        run: |
          import json
          from pathlib import Path

          expected = {
              "lumped": {"jpa-kerr", "jpa-flux", "jpa-compression"},
              "cpw": {"cpw-layout", "cpw-passive", "cpw-flux", "cpw-gain", "cpw-photon-balance", "cpw-fit-residual"},
          }
          for example, required in expected.items():
              notebook = json.loads(Path(f"/tmp/qpdk-vacask-{example}.ipynb").read_text())
              cells = [cell for cell in notebook["cells"] if cell["cell_type"] == "code"]
              if not cells or any(cell["execution_count"] is None for cell in cells):
                  raise SystemExit(f"Incomplete execution: {example}")
              plotted = set()
              for cell in cells:
                  if any(output["output_type"] == "error" for output in cell.get("outputs", [])):
                      raise SystemExit(f"Failed simulation: {example}")
                  if any("image/png" in output.get("data", {}) for output in cell.get("outputs", [])):
                      plotted.update(cell["metadata"].get("tags", []))
              if missing := required - plotted:
                  raise SystemExit(f"Missing scientific results in {example}: {sorted(missing)}")
