# Configuration for GitHub Actions PR Labeler
# https://github.com/actions/labeler
ansys-aedt:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'qpdk/simulation/**/*'
              - 'notebooks/src/hfss*.py'
ci:
  - any:
      - changed-files:
          - any-glob-to-any-file: '.github/workflows/**/*'
components:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'qpdk/cells/**/*'
dependencies:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'pyproject.toml'
          - any-glob-to-any-file: 'uv.lock'
          - any-glob-to-any-file: 'requirements*.txt'
documentation:
  - any:
      - changed-files:
          - any-glob-to-any-file: '*.md'
          - any-glob-to-any-file: 'docs/**/*'
          - any-glob-to-any-file: '.github/write_cells.py'
          - any-glob-to-any-file: '.github/write_models.py'
fabrication:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'qpdk/tech.py'
              - 'qpdk/layers.yaml'
              - 'qpdk/klayout/**/*'
infrastructure:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'Dockerfile'
              - 'Makefile'
              - 'justfile'
              - '.github/CODEOWNERS'
              - '.github/agents/**/*'
              - '.github/dependabot.yml'
              - '.github/labeler.yml'
              - '.github/release-drafter.yml'
              - '.github/lychee.toml'
junctions:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'qpdk/cells/junction.py'
              - 'qpdk/models/junction.py'
drc:
  - any:
      - changed-files:
          - any-glob-to-any-file: '.github/workflows/drc.yml'
          - any-glob-to-any-file: '**/*.drc'
models:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'qpdk/models/**/*'
notebooks:
  - any:
      - changed-files:
          - any-glob-to-any-file: '*.ipynb'
          - any-glob-to-any-file: 'notebooks/**/*'
pdk:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'qpdk/**/*'
pre_commit:
  - any:
      - changed-files:
          - any-glob-to-any-file: '.pre-commit-config.yaml'
          - any-glob-to-any-file: '.github/.bake.toml'
          - any-glob-to-any-file: '.github/.checkmake.ini'
          - any-glob-to-any-file: '.github/.markdownlint-cli2.yaml'
          - any-glob-to-any-file: '.github/.stylelintrc.yaml'
          - any-glob-to-any-file: '.github/.yamlfmt.yaml'
          - any-glob-to-any-file: '.github/.yamllint.yaml'
          - any-glob-to-any-file: '.github/check-notebook-sources.sh'
          - any-glob-to-any-file: '.github/convert-notebooks.sh'
          - any-glob-to-any-file: '.github/zizmor.yml'
          - any-glob-to-any-file: '.github/.bake.toml'
          - any-glob-to-any-file: '.github/.bake.toml'
python:
  - any:
      - changed-files:
          - any-glob-to-any-file: '**/*.py'
qubits:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'qpdk/cells/transmon.py'
              - 'qpdk/cells/fluxonium.py'
              - 'qpdk/cells/unimon.py'
              - 'qpdk/cells/derived/**/*'
              - 'qpdk/models/qubit.py'
              - 'qpdk/models/unimon.py'
              - 'qpdk/models/perturbation.py'
resonators:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'qpdk/cells/resonator.py'
              - 'qpdk/models/resonator.py'
samples:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'qpdk/samples/**/*'
simulations:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'qpdk/simulation/**/*'
tests:
  - any:
      - changed-files:
          - any-glob-to-any-file: 'tests/**/*'
          - any-glob-to-any-file: 'test_*.py'
          - any-glob-to-any-file: '*_test.py'
3d-integration:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'qpdk/cells/airbridge.py'
              - 'qpdk/cells/bump.py'
              - 'qpdk/cells/tsv.py'
