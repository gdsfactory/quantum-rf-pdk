[project]
name = "qpdk"
version = "0.4.0"
description = "Generic Superconducting Quantum Process Design Kit"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "gdsfactory", email = "contact@gdsfactory.com" }]
keywords = [
  "gdsfactory",
  "layout",
  "microwave",
  "pdk",
  "python",
  "quantum",
  "rf",
  "simulation",
  "superconducting",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["gdsfactory~=9.51.0", "typing-extensions>=4.12.0"]

[project.urls]
"Bug Tracker" = "https://github.com/gdsfactory/quantum-rf-pdk/issues"
changelog = "https://github.com/gdsfactory/quantum-rf-pdk/releases"
documentation = "https://gdsfactory.github.io/quantum-rf-pdk/"
repository = "https://github.com/gdsfactory/quantum-rf-pdk/"

[project.optional-dependencies]
circulax = ["circulax>=0.2.3", "optax"]
# Dependencies of the gdsfactoryplus v2 SDK exercised by the gfp test suite.
# The SDK itself is not on PyPI: gdsfactoryplus >= 2.0 ships bundled inside
# the public GDSFactory+ VS Code extension, and `just test-gfp` extracts it
# from there onto PYTHONPATH (see tests/test.just). Listed here are only the
# SDK's own dependencies that the suite imports.
gdsfactoryplus = [
  "doroutes>=1.4.0,<2.0.0",
  "elvis-lvs",
  "httpx",
  "inspice",
  "jaxellip",
  "kfnetlist",
  "sax>=0.18.2,<1",
]
graphics = ["trimesh", "pyglet<3"]
hfss = ["polars", "pyaedt[graphics]>=0.15.0"]
models = [
  "gplugins[meshwell]~=2.1.0",
  # gsim pulls in gdsfactoryplus, which is 3.12-only (cp312 wheels, ~=3.12.0).
  "gsim>=0.5; python_version < '3.13'",
  "jaxellip",
  "optax",
  "optuna",
  "sax>=0.18.2,<1",
  "scikit-learn",
  "scikit-rf",
  "sympy",
  "polars",
  "pandas[parquet]",
]
netket = ["netket>=3.12", "flax", "optax"]
pymablock = ["pymablock>=2.2.1"]
qutip = ["qutip-jax>=0.1.1", "qutip-qip>=0.4.1"]
ray = ["ray[default]", "tqdm"]
scqubits = ["scqubits"]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
docs = [
  "jinja2",
  "jupytext",
  "kwasm",
  "linkify-it-py",
  "matplotlib",
  "myst-nb>=1.0",
  "pydata-sphinx-theme",
  "scipy",
  "sphinx>=9.1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-github-alerts>=1.0",
  "sphinxcontrib-bibtex",
  "sphinxcontrib-bibtex-urn",
  "sphinxcontrib-mermaid>=2.0.1",
  "sphinxcontrib-svgbob",
  "typsphinx>=0.9.2,<0.10",
  { include-group = "docs-models" },
]
docs-models = [
  "circulax>=0.2.3",
  "flax",
  "gplugins[meshwell]~=2.1.0",
  # gsim pulls in gdsfactoryplus, which is 3.12-only (cp312 wheels, ~=3.12.0).
  "gsim>=0.5; python_version < '3.13'",
  "jaxellip",
  "netket>=3.12",
  "optax",
  "optuna",
  "pandas[parquet]",
  "polars",
  "pyaedt[graphics]>=0.15.0",
  "pymablock>=2.2.1",
  "qutip-jax>=0.1.1",
  "qutip-qip>=0.4.1",
  "ray[default]",
  "sax>=0.18.2,<1",
  "scikit-learn",
  "scikit-rf",
  "scqubits",
  "sympy",
  "tqdm",
]
github = ["genbadge[coverage]", "setuptools"]
lint = ["prek", { include-group = "stubs" }]
stubs = ["scipy-stubs"]
test = [
  "hypothesis",
  "jsondiff",
  "pytest>=9.0.0",
  "pytest-cov",
  "pytest-github-actions-annotate-failures",
  "pytest_regressions",
  "pytest-xdist",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.12.0"]
build-backend = "uv_build"

[tool.codespell]
ignore-words-list = "te, te/tm, te, ba, fpr, fpr_spacing, ro, nd, donot, scheme, schem, Commun, Ue, inout, retuned, Retuned"
skip = "bibliography.bib"

[tool.coverage.run]
source = ["qpdk"]
relative_files = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.", "pragma: no cover"]

[tool.elvis]
short-layers = [[1, 0], [25, 0], [31, 0], [2, 0], [30, 0], [10, 0]]
connected-layers = [
  [[1, 0], [31, 0]],
  [[31, 0], [2, 0]],
  [[1, 0], [30, 0]],
  [[30, 0], [2, 0]],
  [[1, 0], [10, 0]],
  [[2, 0], [10, 0]],
]

[tool.elvis.equivalent-ports]
launcher = [["o1", "waveport"]]

[tool.gdsfactoryplus]
name = "qpdk"

[tool.gdsfactoryplus.drc]
pdk = "quantum_rf"
timeout = 300

[tool.gdsfactoryplus.sim.x]
max = 15  # 15GHz
min = 1  # 1GHz
name = "f"
num = 4001
unit = "GHz"

[tool.gdsfactoryplus.pdk]
name = "qpdk"

# Read directly from this file by the gdsfactoryplus >= 2.0 sidebar webview
# (not part of the v2 settings schema; the "Make default" sidebar action
# also writes this key). Selects the default library chips in the GF+ sidebar.
[tool.gdsfactoryplus.sidebar]
default_libraries = ["qpdk"]

# qpdk has no via_stack cell; tells the v2 Livewire router not to expect vias.
[tool.gdsfactoryplus.livewire]
has_vias = false

[tool.interrogate]
docstring-style = "google"
exclude = [
  "docs/_build/**/*",
  "qpdk/**/__init__.py",
  "notebooks/**",
  "docs/notebooks/*",
  "qpdk/samples/*.py",
  "tests/**",
]
ext = []
fail-under = 100
ignore-nested-classes = true
ignore-nested-functions = true
ignore-regex = ["^test_.*"]
omit-covered-files = true
verbose = 2

[tool.mypy]
strict = true

[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = true

[tool.pyrefly]
project-excludes = [
  "**/__pycache__",
  "**/.*",
  "docs/**",
  "build/**",
  "dist/**",
  "*.egg-info/**",
  ".venv/**",
  # Exclude samples that may have experimental code
  "qpdk/samples/*.py",
  "qpdk/samples/**/*.py",
  "notebooks/src/*.py",
  "notebooks/src/**/*.py",
]
project-includes = ["**/*.py"]

[tool.pyrefly.errors]
# Not all gdsfactory overloads are properly typed
no-matching-overload = "ignore"

[tool.pytest]
addopts = ["--tb=short"]
filterwarnings = [
  # gdsfactory internally warns about bend_euler for non-90/180 angles even
  # when the user calls bend_circular; suppress until upstream fixes this.
  "ignore:bend_euler angle should be 90 or 180:UserWarning",
  # Equinox uses deprecated JAX core internals; nothing we can fix upstream
  "ignore:jax\\.core\\.mapped_aval is deprecated:DeprecationWarning",
  "ignore:jax\\.core\\.unmapped_aval is deprecated:DeprecationWarning",
]
markers = [
  "gfp: mark test as requiring GDSFactory+ (gdsfactoryplus)",
  "hfss: mark test as requiring HFSS",
  "skip_windows: skip test on Windows",
]
norecursedirs = [
  "*.egg",
  ".*",
  "CVS",
  "_darcs",
  "build",
  "dist",
  "extra/*.py",
  "node_modules",
  "venv",
  "{arch}",
]
python_files = ["notebooks/*.ipynb", "qpdk/*.py", "tests/*.py"]
testpaths = ["qpdk/", "tests"]

[tool.ruff]
fix = true
preview = true

[tool.ruff.format]
docstring-code-format = true
exclude = ["*.ipynb"]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = [
  "line-too-long",  # line too long, handled by black
  "function-call-in-default-argument",  # do not perform function calls in argument defaults
  "complex-structure",  # too complex
  "zip-without-explicit-strict",  # `zip()` without an explicit `strict=` parameter
  "unnecessary-collection-call",  # C408 Unnecessary `dict` call (rewrite as a literal)
  "ambiguous-unicode-character-string",  # ambiguous unicode characters (incl. lots of math)
  "ambiguous-unicode-character-docstring",  # ambiguous unicode characters (incl. docstring greek letters)
  "ambiguous-unicode-character-comment",  # -||- but for comments
  "non-empty-init-module",  # non-empty-init-module
  "magic-value-comparison",  # magic-value-comparison
  "too-many-arguments",  # too-many-arguments
  "too-many-locals",  # too-many-locals
  "non-ascii-name",  # non-ascii-name
  "non-ascii-import-name",  # non-ascii-import-name
  "non-lowercase-variable-in-function",  # non-lowercase-variable-in-function
  "invalid-argument-name",  # invalid-argument-name
  "commented-out-code",  # commented-out-code
  "too-many-positional-arguments",  # too-many-positional-arguments
  "raise-vanilla-args",  # long messages in exceptions
  "builtin-import-shadowing",  # builtin-import-shadowing
  "mixed-case-variable-in-global-scope",  # mixed-case-variable-in-global-scope
  "import-private-name",  # import-private-name
  "too-many-return-statements",  # too-many-return-statements
  "non-augmented-assignment",  # non-augmented-assignment
  "too-many-branches",  # too-many-branches
  "too-many-statements",  # too-many-statements
  "too-many-boolean-expressions",  # too-many-boolean-expressions
  "suspicious-subprocess-import",  # suspicious-subprocess-import
  "subprocess-run-without-check",  # subprocess-run-without-check
  "start-process-with-partial-path",  # start-process-with-partial-path
  "runtime-cast-value",  # runtime-cast-value
]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "C4",  # flake8-comprehensions
  "B",  # flake8-bugbear
  "D",  # pydocstyle
  "UP",  # pyupgrade
  "T10",  # flake8-debugger
  "S",  # flake8-bandit
  "PT",  # flake8-pytest-style
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "Q",  # flake8-quotes
  "SLOT",  # flake8-slots
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "PD",  # pandas-vet
  "FLY",  # flynt
  "NPY",  # numpy
  "PERF",  # perflint
  "RUF",  # ruff
  "PL",  # pylint
  "N",  # pep8-naming
  "A",  # flake8-builtins
  "TRY",  # tryceratops
  "T20",  # flake8-print
  "ISC",  # flake8-implicit-str-concat
  "ERA",  # eradicate
  "FURB",  # refurb
  "DOC",  # pydoclint
  "ASYNC",  # flake8-async
  "TID",  # flake8-tidy-imports
  "C",  # flake8-comprehensions
]

[tool.ruff.lint.flake8-tidy-imports]
require-lazy = [
  "trimesh",
  "polars",
  "pyaedt",
  "gplugins",
  "jaxellip",
  "optax",
  "optuna",
  "sax",
  "sympy",
  "pandas",
  "netket",
  "flax",
  "pymablock",
  "qutip-jax",
  "qutip-qip",
  "scqubits",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# E402: notebooks import modules after setup code (e.g. PDK.activate()) by design.
# S101: notebooks assert sanity checks of embedded simulation data so the
# cell fails loudly on inconsistency.
# Set here rather than with in-file `# ruff:` comments, which leak into the
# rendered documentation pages.
# B018: a bare expression at the end of a cell is how a notebook displays it.
# PLC0415: ray comes from the optional ray extra.
"notebooks/**/*.py" = [
  "useless-expression",
  "undocumented-public-module",
  "module-import-not-at-top-of-file",
  "import-outside-top-level",
  "assert",
  "print"
]
# CI helper: gsim (a models-extra dependency) is imported in a function,
# asserts are the checks, prints go to the Actions log, and Palace's eig.csv
# column names contain literal braces.
".github/palace_smoke.py" = [
  "import-outside-top-level",
  "print",
  "assert",
  "missing-f-string-syntax"
]
# gsim is an optional (models-extra) dependency, so fem.py imports it lazily.
"qpdk/simulation/fem.py" = ["import-outside-top-level"]
# Same for palace_run.py, which also activates the PDK when a worker imports it
# cold.
"qpdk/simulation/palace_run.py" = ["import-outside-top-level"]
# gsim is only available with the models extra on Python 3.12.
"qpdk/simulation/transmon_sweep.py" = ["import-outside-top-level"]
# ray is an optional (ray-extra) dependency, so study.py imports it lazily.
"qpdk/simulation/study.py" = ["import-outside-top-level"]
# trial.py is a command-line entry point for one trial; its stdout is the
# task's log, which is where a failed solve says why.
"qpdk/simulation/trial.py" = ["print"]
"qpdk/cells/__init__.py" = ["undefined-local-with-import-star"]
"qpdk/models/__init__.py" = ["undefined-local-with-import-star"]
"qpdk/**/__init__.py" = [
  "undefined-local-with-import-star"
]  # allowing star imports to aggregate cells
"qpdk/samples/**/*.py" = [
  "undocumented-public-module",
  "too-many-statements-in-try-clause",
  "print",
]  # no public module docstring for sample scripts, print allowed in samples
"tests/**" = [
  "assert",
  "undocumented-public-method",
  "undocumented-public-function",
  "ANN",
  "too-many-statements-in-try-clause",
  "print"
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.lyp", "*.lyt", "*.csv", "*.gds", "*.oas"]

[tool.tbump]
[[tool.tbump.file]]
src = "pyproject.toml"

[[tool.tbump.file]]
src = "qpdk/__init__.py"

[[tool.tbump.file]]
src = "README.md"

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "0.4.0"

[tool.tombi.schema]
strict = false

[tool.towncrier]
directory = ".changelog.d"
filename = "CHANGELOG.md"
template = ".changelog.d/changelog_template.jinja"

[tool.uv]
default-groups = ["dev", "lint", "stubs", "test"]

[tool.uv.build-backend]
module-root = ""
source-exclude = ["tests/**", "docs/**"]
